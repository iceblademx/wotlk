name: Build and Deploy
on:
  push:
    branches:
      - master
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Install Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.23.x

      - name: Install Protoc
        uses: arduino/setup-protoc@v1
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Protoc Go plugin
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: '19'

      - name: Checkout 🛎️
        uses: actions/checkout@v2.3.1

      - name: Build 🔧
        run: |
          make dist/wotlk/.dirstamp

      - name: Test
        run: |
          make test

      # The site is built for the /wotlk/ path, which is where GitHub Pages serves this repo (named wotlk).
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/wotlk

      - name: Deploy 🚀
        id: deployment
        uses: actions/deploy-pages@v5
